# CI for the Dezoxy/lingarr fork: test every push, publish images only from release tags.
# Upstream workflows (ci, docker-build, docs, pr-comment) are disabled in this fork; they target
# upstream's branches and Docker Hub secrets.
name: Fork CI

on:
  push:
    branches: [homelab, "fix/**"]
    tags: ["v*-anthropic.*"]
  pull_request:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  # Never cancel a tag build halfway through publishing
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/dezoxy/lingarr

jobs:
  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Lingarr.slnx
      - run: dotnet build Lingarr.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=false
      - name: Test
        run: >
          dotnet test Lingarr.Server.Tests/Lingarr.Server.Tests.csproj --no-build --configuration Release
          --filter "Category!=Integration" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: server-test-results
          path: TestResults/*.trx
          retention-days: 14

  test-migrations:
    name: Migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Lingarr.Migrations.Tests/Lingarr.Migrations.Tests.csproj --configuration Release

  test-client:
    name: Client build and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Lingarr.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx vue-tsc --noEmit

  image:
    name: Image (build, smoke test, scan, publish on tag)
    needs: [test-server, test-migrations, test-client]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image to GHCR (tag builds only)
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Lingarr (Dezoxy fork)
            org.opencontainers.image.licenses=AGPL-3.0

      # Build once into the local Docker engine so the exact image is tested before it is pushed
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Lingarr.Server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: lingarr:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          # Release builds never restore the shared Actions cache (cache poisoning); the publish
          # step below reuses this job's own builder cache, so it pushes the layers tested here.
          cache-from: ${{ env.PUBLISH != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.PUBLISH != 'true' && 'type=gha,mode=max' || '' }}

      - name: Smoke test
        run: |
          docker run -d --name lingarr-smoke -p 9876:9876 \
            -e DB_CONNECTION=sqlite -e ASPNETCORE_HTTP_PORTS=9876 lingarr:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9876/api/version; then echo; exit 0; fi
            sleep 2
          done
          docker logs lingarr-smoke
          exit 1

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lingarr:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Lingarr.Server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}:${GITHUB_REF_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
