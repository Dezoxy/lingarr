# Fork configuration: npm and NuGet versions follow upstream releases, so only the fork's own
# pins are updated here. Vulnerable dependencies still get Dependabot security update PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "homelab"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # let new releases settle before pinning them
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/Lingarr.Server"
    target-branch: "homelab"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
